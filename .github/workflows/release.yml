name: Release

# Push a tag like v1.2.3 to:
#   1. build an APK and an App Bundle signed with the app's original key,
#   2. publish the APK as a GitHub Release,
#   3. send the bundle, release notes and store listing in fastlane/metadata/android to
#      Play production (once PLAY_SERVICE_ACCOUNT_JSON is set). Google reviews it, then
#      it goes live.
# Both outputs share one signing key, so web and Play installs can upgrade each other.
# See RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write  # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be <= 99 (got $name)"; exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [[ ! -f "$notes" ]]; then
            echo "::error::No release notes. Add $notes (and the other languages) before tagging."; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and bundle
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --console=plain assembleRelease bundleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/microphone-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}
          path: dist/

      # Create-or-update, so a re-run after a failed Play upload doesn't trip over the existing release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: dist/microphone-${{ steps.version.outputs.name }}.apk
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Microphone ${{ steps.version.outputs.name }}" --generate-notes --verify-tag
          fi

      - uses: ruby/setup-ruby@v1
        if: env.HAS_PLAY == 'true'
        with:
          ruby-version: '3.4'

      # Uploads the bundle with the release notes for this version code, and replaces the
      # store listing (text and screenshots) with what's in the repo.
      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true'
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          gem install fastlane --version 2.242.0 --no-document
          fastlane supply \
            --package_name net.bitplane.android.microphone \
            --track production \
            --release_status completed \
            --aab dist/app-release.aab \
            --mapping dist/mapping.txt \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --sync_image_upload true

      - name: Note skipped Play upload
        if: env.HAS_PLAY != 'true'
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON isn't set, so the Play upload was skipped."
